name: Run map streets

# The OpenStreetMap shape of every street named in the run routes, into data/run-streets.json (tools/streets/fetch_streets.py).
# Overpass refuses GitHub's machines, so this takes Geofabrik's Australia extract and cuts the peninsula's roads out with osmium.
# Run from the Actions tab, or when the script or the routes change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/streets/*.py', 'data/run-routes.json', '.github/workflows/run-streets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Roads of the peninsula
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSL -o aus.osm.pbf https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
          ls -la aus.osm.pbf
          osmium extract -b 144.68,-38.51,145.26,-38.15 aus.osm.pbf -o pen.osm.pbf --overwrite
          osmium tags-filter pen.osm.pbf w/highway -o roads.osm.pbf --overwrite
          osmium export roads.osm.pbf -f geojsonseq -o roads.geojsonseq --geometry-types=linestring -a id --overwrite
          wc -l roads.geojsonseq
      - run: python3 tools/streets/fetch_streets.py roads.geojsonseq
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in data/run-streets.json tools/streets/last-run.log; do [ -f "$f" ] && git add -f "$f"; done
          git diff --cached --quiet || (git commit -m "Run map streets from OpenStreetMap" && git pull --rebase origin main && git push origin HEAD:main)
