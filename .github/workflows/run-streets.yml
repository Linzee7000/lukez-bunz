name: Run map streets

# Fetches the OpenStreetMap shape of every street named in the run routes into data/run-streets.json
# (tools/streets/fetch_streets.py). Run from the Actions tab, or when the script or the routes change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/streets/**', 'data/run-routes.json', '.github/workflows/run-streets.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/streets/fetch_streets.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/run-streets.json
          git diff --cached --quiet || (git commit -m "Run map streets from OpenStreetMap" && git pull --rebase origin main && git push origin HEAD:main)
