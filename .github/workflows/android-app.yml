name: Android app

# Builds the Lukez Bunz Android app (APK) whenever the app shell changes, or on demand
# from the Actions tab ("Run workflow"). Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-app.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and sync
        working-directory: app
        run: |
          npm ci
          npm run copy-web
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lukez-bunz-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a new file name every build, so a phone never reopens an older download of the same name
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "lukez-bunz-v1.${GITHUB_RUN_NUMBER}.apk"
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "lukez-bunz-v1.${GITHUB_RUN_NUMBER}.apk" --title "Lukez Bunz Android app v1.${GITHUB_RUN_NUMBER}" --notes "Latest Android build (v1.${GITHUB_RUN_NUMBER}). Download the .apk below and install it." --target "$GITHUB_SHA"
