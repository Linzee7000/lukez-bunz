name: Android app

# Builds the Lukez Bunz Android app (APK) whenever the app shell changes, or on demand
# from the Actions tab ("Run workflow"). Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-app.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and sync
        working-directory: app
        run: |
          npm ci
          npm run copy-web
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lukez-bunz-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
