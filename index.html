<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lukez Bunz</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f3f5; margin: 0; padding: 14px; color: #333; font-weight: 400; }
    .container { max-width: 580px; margin: 0 auto; padding-bottom: 60px; }
    
    .app-header {
      background-color: #1b4332;
      color: #ffffff;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .app-header h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.5px; }

    .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); position: relative; }
    
    /* Top Bar */
    .sync-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
    .sync-status { font-size: 12px; color: #475569; font-weight: 400; line-height: 1.2; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .gps-badge {
      font-size: 11px;
      font-weight: 500;
      color: #166534;
      background: #dcfce7;
      border: 1px solid #86efac;
      padding: 3px 6px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .gps-badge.searching { color: #854d0e; background: #fef9c3; border-color: #fde047; }

    .icon-refresh-btn {
      background: #2d6a4f;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .icon-refresh-btn.has-edits { background: #d97706; }
    .icon-refresh-btn:active { transform: scale(0.95); }
    .icon-refresh-btn:disabled { background: #94a3b8; }

    .progress-bar-wrap { width: 100%; height: 7px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-bottom: 10px; display: none; }
    .progress-bar-fill { height: 100%; width: 0%; background: #2d6a4f; transition: width 0.15s ease; }

    /* Compact Controls Row */
    .controls-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; position: relative; }
    .search-toggle-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .search-toggle-btn:active, .search-toggle-btn.active { background: #2d6a4f; color: white; border-color: #2d6a4f; }

    .filter-select {
      height: 36px;
      padding: 0 8px;
      font-size: 13px;
      font-weight: 400;
      color: #334155;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px;
      padding-right: 22px;
    }
    .stream-select { flex: 1 1 40%; }

    .multi-run-btn {
      flex: 1 1 60%;
      height: 36px;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 400;
      color: #334155;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .multi-run-btn.active { border-color: #2d6a4f; background: #eef7f2; }
    .multi-run-btn::after { content: "▾"; font-size: 11px; margin-left: 6px; color: #64748b; }

    .runs-dropdown-panel {
      display: none;
      position: absolute;
      top: 42px;
      right: 0;
      left: 0;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      z-index: 50;
      padding: 10px;
      max-height: 250px;
      overflow-y: auto;
    }
    .runs-dropdown-panel.open { display: block; }
    .runs-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #e2e8f0; font-size: 11.5px; font-weight: 600; color: #475569; }
    .runs-action-links span { color: #2d6a4f; cursor: pointer; margin-left: 8px; font-weight: 500; }
    .runs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
    .run-check-item { font-size: 12px; color: #334155; display: flex; align-items: center; gap: 5px; cursor: pointer; background: #f8fafc; padding: 5px 6px; border-radius: 6px; border: 1px solid #e2e8f0; }
    .run-check-item input { margin: 0; }

    .search-input-wrap { display: none; margin-bottom: 10px; }
    .search-input-wrap.open { display: block; }
    input[type="text"] { width: 100%; padding: 10px 12px; font-size: 15px; border-radius: 8px; border: 1px solid #ccc; font-weight: 400; outline: none; }
    input[type="text"]:focus { border-color: #2d6a4f; }

    .filter-bar-single {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #f8fafc;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .checkbox-label { font-size: 12.5px; font-weight: 400; color: #334155; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; flex-shrink: 0; }
    .checkbox-label input { width: 16px; height: 16px; margin: 0; }

    .count-msg { font-size: 13.5px; font-weight: 500; color: #475569; margin-bottom: 12px; }
    
    /* Address Cards */
    .address-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid #2d6a4f; position: relative; }
    .address-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
    .address-lhs { flex-grow: 1; }
    .address-line1 { font-size: 15.5px; font-weight: 500; color: #1e293b; line-height: 1.35; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .address-line2 { font-size: 13px; font-weight: 400; color: #64748b; margin-top: 2px; }
    .distance-pill { font-size: 11px; font-weight: 600; color: #15803d; background: #dcfce7; padding: 1px 6px; border-radius: 4px; }
    .addr-map-pin { font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }

    .property-rhs-badge { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 5px 8px; text-align: right; min-width: 105px; flex-shrink: 0; }
    .rhs-ids { font-size: 11px; font-weight: 400; color: #475569; white-space: nowrap; }
    .rhs-type { font-size: 11px; font-weight: 400; color: #64748b; text-transform: uppercase; margin-top: 2px; }

    /* Property Action Toolbar */
    .prop-action-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 8px 0;
      flex-wrap: wrap;
    }
    .prop-tool-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .prop-tool-btn:active { background: #e2e8f0; }

    /* Rating Display */
    .rating-banner {
      background: #fefce8;
      border: 1px solid #fef08a;
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #854d0e;
    }
    .rating-stars-val { font-size: 13px; color: #eab308; font-weight: bold; }
    .rating-comment-text { font-size: 11.5px; color: #713f12; margin-top: 2px; font-style: italic; }

    .property-count-row { margin-bottom: 8px; font-size: 13px; font-weight: 500; color: #2d6a4f; display: flex; justify-content: space-between; align-items: center; }

    .stream-counts-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .stream-count-pill { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; text-transform: uppercase; }
    .pill-gar { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .pill-rec { background-color: #fef08a; color: #111111; border: 1px solid #facc15; }
    .pill-fog { background-color: #dcfce7; color: #166534; border: 1px solid #4ade80; }

    .schedule-bar { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .collection-day-badge { font-size: 14px; font-weight: 500; color: #1e293b; }
    .schedule-cycle { font-size: 12px; font-weight: 500; color: #1e293b; background: #e2e8f0; padding: 3px 8px; border-radius: 6px; }

    .stream-group-card { border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff; margin-bottom: 10px; overflow: hidden; }
    .stream-group-card:last-child { margin-bottom: 0; }
    
    .stream-group-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; font-size: 13px; letter-spacing: 0.3px; }
    .header-left { display: flex; align-items: center; gap: 6px; }
    .stream-title { font-weight: 500; font-size: 13px; }
    .header-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    
    .add-bin-btn {
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.4);
      color: inherit;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
    }
    
    .hdr-run-badge { font-size: 12px; font-weight: 500; padding: 2px 7px; border-radius: 5px; line-height: 1.2; }
    .hdr-run-gar { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .hdr-run-rec { background: #fef08a; color: #111111; border: 1px solid #facc15; }
    .hdr-run-fog { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .hdr-run-summer { background: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }

    .header-gar { background-color: #dc2626; color: #ffffff; }
    .header-rec { background-color: #facc15; color: #111111; }
    .header-fog { background-color: #16a34a; color: #ffffff; }

    .serials-list { padding: 8px 12px; background: #f8f9fa; line-height: 1.4; }
    .bin-entry { padding: 6px 0; border-bottom: 1px solid #edf2f7; }
    .bin-entry:last-child { border-bottom: none; padding-bottom: 0; }
    .bin-entry:first-child { padding-top: 0; }

    .serial-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .serial-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .size-badge { font-size: 11px; font-weight: 500; background: #e2e8f0; color: #334155; padding: 2px 6px; border-radius: 5px; border: 1px solid #cbd5e1; letter-spacing: 0.3px; white-space: nowrap; }
    .make-badge { font-size: 11px; font-weight: 500; background: #ede9fe; color: #5b21b6; padding: 2px 6px; border-radius: 5px; border: 1px solid #ddd6fe; white-space: nowrap; }
    .serial-text { font-size: 14px; font-weight: 500; color: #111; line-height: 1.35; text-transform: uppercase; }
    .serial-subline { font-size: 12px; color: #555; font-weight: 400; display: block; margin-top: 1px; text-transform: uppercase; }
    .serial-notes-tag { display: block; font-size: 11px; color: #b45309; background: #fef3c7; border: 1px solid #fde68a; padding: 2px 5px; border-radius: 4px; margin-top: 3px; font-style: italic; }
    
    .serial-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .warn-icon { font-size: 13px; display: inline-flex; align-items: center; }
    
    .info-btn { background: #e2e8f0; border: 1px solid #cbd5e1; color: #334155; padding: 2px 6px; border-radius: 5px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; line-height: 1; font-weight: 400; }
    .edit-btn { background: #e2e8f0; border: 1px solid #cbd5e1; color: #334155; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 400; cursor: pointer; }
    .edited-badge { font-size: 10px; font-weight: 500; color: #b45309; background: #fef3c7; border: 1px solid #fde68a; padding: 1px 4px; border-radius: 4px; }

    .bin-meta-drawer { display: none; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 6px; padding-left: 6px; font-size: 11px; }
    .bin-meta-drawer.open { display: flex; }

    .meta-tag { background: #eef2f6; border: 1px solid #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #334155; font-weight: 400; }
    .flip-map-link { display: inline-flex; align-items: center; gap: 3px; background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; text-decoration: none; }

    .stream-council-section { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #cbd5e1; }
    .stream-council-title { font-size: 11px; font-weight: 500; color: #111111; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
    .council-bin-entry { padding: 4px 0; border-bottom: 1px dotted #e2e8f0; }
    .council-bin-entry:last-child { border-bottom: none; padding-bottom: 0; }

    .flag-box { margin-bottom: 10px; padding: 6px 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; color: #475569; font-size: 12px; font-weight: 400; }
    .parent-info { font-size: 12px; color: #555; margin-bottom: 8px; font-weight: 400; }

    details.other-bins-collapse { border: 1px dashed #cbd5e1; border-radius: 8px; margin-top: 10px; background: #fafbfc; overflow: hidden; }
    details.other-bins-collapse summary { padding: 8px 12px; font-size: 13px; font-weight: 500; color: #64748b; cursor: pointer; user-select: none; background: #f1f5f9; outline: none; }
    details.other-bins-collapse summary:hover { color: #334155; background: #e2e8f0; }
    .other-bins-content { padding: 10px 10px 4px 10px; }

    .empty-state { text-align: center; color: #777; padding: 20px 0; font-weight: 400; }

    /* Modal Overlay & Forms */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .modal-header h3 { margin: 0; font-size: 16px; color: #1e293b; }
    .modal-close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b; line-height: 1; }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }

    .star-rating-row {
      display: flex;
      gap: 6px;
      font-size: 24px;
      color: #cbd5e1;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .star-rating-row span.selected { color: #eab308; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
    }
    .btn-cancel { background: #f1f5f9; border: 1px solid #cbd5e1; color: #475569; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-save { background: #2d6a4f; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
  </style>
</head>
<body>

<div class="container">
  <div class="app-header">
    <h1>Lukez Bunz</h1>
  </div>

  <div class="card">
    <div class="sync-bar">
      <div id="syncStatus" class="sync-status">Ready</div>
      <div id="gpsStatusBadge" class="gps-badge searching">🛰️ GPS...</div>
      <button id="syncBtn" class="icon-refresh-btn" type="button" onclick="startUpdateProcess()" title="Check Updates">🔄</button>
    </div>

    <div id="pBarWrap" class="progress-bar-wrap">
      <div id="pBarFill" class="progress-bar-fill"></div>
    </div>

    <div class="controls-row">
      <button id="searchToggleBtn" class="search-toggle-btn" type="button" onclick="toggleSearchBar()" title="Toggle Search Input">🔍</button>
      
      <select id="streamFilterSelect" class="filter-select stream-select" onchange="handleSearch()">
        <option value="">All Streams</option>
        <option value="Garbage">🗑️ Garbage</option>
        <option value="Recycling">♻️ Recycle</option>
        <option value="FOGO">🌳 FOGO</option>
      </select>

      <button id="multiRunBtn" class="multi-run-btn" type="button" onclick="toggleRunsPanel()">Runs (All)</button>

      <div id="runsDropdownPanel" class="runs-dropdown-panel">
        <div class="runs-panel-header">
          <span>Filter Runs:</span>
          <div class="runs-action-links">
            <span onclick="selectAllRuns(true)">All</span>
            <span onclick="selectAllRuns(false)">Clear</span>
            <span onclick="toggleRunsPanel()">Done</span>
          </div>
        </div>
        <div id="runsChecklistGrid" class="runs-grid"></div>
      </div>
    </div>

    <div id="searchInputWrap" class="search-input-wrap">
      <input type="text" id="searchInput" placeholder="Search serial, address, street, ID..." oninput="handleSearch()">
    </div>
    
    <div class="filter-bar-single">
      <label class="checkbox-label">
        <input type="checkbox" id="chkBinOnly" onchange="toggleSearchFilter('bin')"> 🔢 Bin №
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkAddrOnly" onchange="toggleSearchFilter('addr')"> 🏠 Address
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkSoloInfo" checked onchange="handleSearch()"> 🚛 Solo
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkCouncilInfo" checked onchange="handleSearch()"> 🏛️ MPSC
      </label>
    </div>
  </div>

  <div id="resultsSummary" class="count-msg" style="display: none;"></div>
  <div id="resultsList"></div>
</div>

<!-- Modal 1: Edit / Add Bin (Serial, Make, Size, Notes) -->
<div id="binEditModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="binModalTitle">Edit Bin</h3>
      <button type="button" class="modal-close-btn" onclick="closeModal('binEditModal')">&times;</button>
    </div>
    <form id="binEditForm" onsubmit="saveBinForm(event)">
      <input type="hidden" id="modalSiteIdx">
      <input type="hidden" id="modalStreamKey">
      <input type="hidden" id="modalBinIdx">
      
      <div class="form-group">
        <label>Stream</label>
        <input type="text" id="modalBinStreamDisplay" readonly style="background:#f1f5f9;">
      </div>

      <div class="form-group">
        <label>Bin Serial Number *</label>
        <input type="text" id="modalBinSerial" required style="text-transform:uppercase;">
      </div>

      <div class="form-group">
        <label>Bin Make / Manufacturer</label>
        <select id="modalBinMake">
          <option value="">-- Select Make --</option>
          <option value="Sulo">Sulo</option>
          <option value="Mastec">Mastec</option>
          <option value="Otto">Otto</option>
          <option value="Craemer">Craemer</option>
          <option value="IPL">IPL</option>
          <option value="Cheetah">Cheetah</option>
          <option value="Spider">Spider</option>
          <option value="Other">Other / Unknown</option>
        </select>
      </div>

      <div class="form-group">
        <label>Bin Size</label>
        <select id="modalBinSize">
          <option value="80L">80L</option>
          <option value="120L">120L</option>
          <option value="240L">240L</option>
          <option value="660L">660L</option>
          <option value="1100L">1100L</option>
        </select>
      </div>

      <div class="form-group">

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;

    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    return R * c;
  }

  function startLiveLocationWatcher() {
    if (!("geolocation" in navigator)) {
      updateGpsBadge(false, "No GPS");
      return;
    }

    if (gpsWatchId !== null) return;

    gpsWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        const accuracy = Math.round(pos.coords.accuracy);
        userCurrentLocation = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        };

        updateGpsBadge(true, `🟢 Live (±${accuracy}m)`);

        const movedDist = getDistanceMeters(
          lastGpsCoords.lat,
          lastGpsCoords.lng,
          userCurrentLocation.lat,
          userCurrentLocation.lng
        );

        if (movedDist >= 3) {
          lastGpsCoords = { ...userCurrentLocation };
          const query = document.getElementById('searchInput').value.trim();
          if (!query && siteRecords.length > 0) {
            handleSearch();
          }
        }
      },
      (err) => {
        updateGpsBadge(false, "⚠️ No Signal");
        console.warn("GPS Error:", err.message);
      },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );
  }

  /* Database Storage Setup */
  function openDB() {
    return new Promise((resolve) => {
      try {
        const req = window.indexedDB.open("LukezBunzMasterDB_v70", 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("store")) db.createObjectStore("store");
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      } catch(e) { resolve(null); }
    });
  }

  async function saveToDB(key, data) {
    try {
      const db = await openDB();
      if (db) {
        return new Promise((resolve) => {
          const tx = db.transaction("store", "readwrite");
          tx.objectStore("store").put(data, key);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      }
    } catch(e) {}
  }

  async function loadFromDB(key) {
    try {
      const db = await openDB();
      if (db) {
        return new Promise((resolve) => {
          const tx = db.transaction("store", "readonly");
          const req = tx.objectStore("store").get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      }
    } catch(e) {}
    return null;
  }

  function parseSoloBinCell(cellStr, size) {
    if (!cellStr) return [];
    return cellStr.split(';;').map(item => {
      const it = item.trim();
      if (!it) return null;
      const parts = it.split('|');
      const serial = parts[0].trim().toUpperCase();
      const meta = {};
      for (let i = 1; i < parts.length; i++) {
        const p = parts[i];
        const colonIdx = p.indexOf(':');
        if (colonIdx > -1) {
          meta[p.substring(0, colonIdx).trim()] = p.substring(colonIdx + 1).trim();
        }
      }
      return {
        serial: serial,
        originalSerial: serial,
        size: size,
        make: meta.m || '',
        notes: meta.n || '',
        lastFlipped: meta.f || '',
        lastUpdated: meta.u || '',
        dist: meta.d || '',
        lat: meta.lat || '',
        lng: meta.lng || ''
      };
    }).filter(Boolean);
  }

  function parseCouncilBinCell(cellStr, size) {
    if (!cellStr) return [];
    return cellStr.split(';').map(item => {
      const serial = item.trim().toUpperCase();
      if (!serial || serial === 'NAN') return null;
      return { serial, size };
    }).filter(Boolean);
  }

  function parseCsvText(text) {
    const lines = [];
    let row = [""];
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      const next = text[i + 1];

      if (c === '"') {
        if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (c === ',' && !inQuotes) {
        row.push('');
      } else if ((c === '\r' || c === '\n') && !inQuotes) {
        if (c === '\r' && next === '\n') { i++; }
        lines.push(row);
        row = [''];
      } else {
        row[row.length - 1] += c;
      }
    }
    if (row.length > 1 || row[0] !== '') lines.push(row);
    return lines;
  }

  async function startUpdateProcess() {
    const btn = document.getElementById('syncBtn');
    btn.disabled = true;
    startLiveLocationWatcher();

    // 1. Post edits log to Google Sheet
    if (masterEditsLog.length > 0 && SCRIPT_URL) {
      setStatus(`⏳ Saving ${masterEditsLog.length} edits...`, 10);
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ edits: masterEditsLog })
        });
      } catch(e) {}
    }

    // 2. Download master CSV
    try {
      setStatus("⏳ Downloading CSV...", 20);
      const res = await fetch("master_combined_with_metadata.csv");
      if (!res.ok) throw new Error(`Could not load CSV file (HTTP ${res.status})`);

      const reader = res.body.getReader();
      let receivedBytes = 0;
      const chunks = [];
      const estimatedTotal = 38 * 1024 * 1024;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        receivedBytes += value.length;
        const mb = (receivedBytes / (1024 * 1024)).toFixed(1);
        const percent = Math.min(90, Math.round((receivedBytes / estimatedTotal) * 70) + 20);
        setStatus(`⏳ ${mb} MB...`, percent);
      }

      setStatus("⏳ Decoding CSV...", 92);
      const allChunks = new Uint8Array(receivedBytes);
      let position = 0;
      for (const chunk of chunks) {
        allChunks.set(chunk, position);
        position += chunk.length;
      }

      const csvText = new TextDecoder("utf-8").decode(allChunks);

      setStatus("⏳ Parsing records...", 95);
      const rows = parseCsvText(csvText);
      const parsed = [];

      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (r.length < 5) continue;

        const propId = r[1] || '';
        const siteId = r[0] || '';

        const soloStreams = { Garbage: [], Recycling: [], FOGO: [] };
        SOLO_STREAMS.forEach(st => {
          st.cols.forEach(cfg => {
            const rawVal = r[cfg.idx] || '';
            if (rawVal) {
              soloStreams[st.key].push(...parseSoloBinCell(rawVal, cfg.sz));
            }
          });
        });

        const councilStreams = { Garbage: [], Recycling: [], FOGO: [] };
        COUNCIL_STREAMS.forEach(st => {
          st.cols.forEach(cfg => {
            const rawVal = r[cfg.idx] || '';
            if (rawVal) {
              councilStreams[st.key].push(...parseCouncilBinCell(rawVal, cfg.sz));
            }
          });
        });

        const totalSoloBins = Number(r[17]) || (soloStreams.Garbage.length + soloStreams.Recycling.length + soloStreams.FOGO.length);
        const totalCouncilBins = Number(r[31]) || (councilStreams.Garbage.length + councilStreams.Recycling.length + councilStreams.FOGO.length);

        const discStr = r[33] || '';
        const discList = discStr ? discStr.split(' | ') : [];

        const fullAddr = r[2] || '';
        const suburb = r[3] || '';
        const postcode = r[4] || '';
        const streetPart = fullAddr.split(',')[0].trim();
        const localityPart = `${suburb} ${postcode}`.trim();

        parsed.push({
          siteId: siteId,
          propId: propId,
          hasCouncilRecord: Boolean(r[22] || r[23] || r[31] !== '0'),
          addressText: fullAddr,
          streetLine: streetPart || fullAddr,
          suburbLine: localityPart,
          soloSchedule: {
            day: r[5] || 'Unknown Day',
            weekLetter: r[6] || '',
            weekFormatted: r[6] ? `Week ${r[6]}` : '',
            garRun: r[7] || '',
            recRun: r[8] || '',
            recSummerRun: r[9] || '',
            fogRun: r[10] || '',
            hasConflict: false
          },
          soloStreams: soloStreams,
          totalSoloBins: totalSoloBins,
          runFlags: r[18] || '',
          parentSiteAddress: r[19] || '',
          lat: r[20] || '',
          lng: r[21] || '',
          councilPropType: r[22] || '',
          councilSchedule: {
            day: r[23] || 'Unknown Day',
            weekLetter: r[24] || '',
            weekFormatted: r[24] ? `Week ${r[24]}` : ''
          },
          councilStreams: councilStreams,
          totalCouncilBins: totalCouncilBins,
          matchStatus: r[32] || '',
          mpscDiscrepancies: discList,
          ratingStars: null,
          ratingComment: ""
        });
      }

      siteRecords = parsed;
      const dateNow = new Date().toLocaleDateString('en-AU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

      setStatus("⏳ Storing locally...", 98);
      await saveToDB("masterRecords", siteRecords);
      await saveToDB("lastSyncTime", dateNow);

      populateRunsChecklist();
      setStatus(`⚡ ${siteRecords.length.toLocaleString()} loaded (${dateNow})`);
      updateSyncButtonUI();
      handleSearch();
    } catch(err) {
      alert("Error: " + err.message);
      setStatus(`❌ ${err.message}`);
    } finally {
      btn.disabled = false;
    }
  }

  function formatSerialRow(b, siteIdx, streamKey, binIdx, showEdit, showWarning = false, propLat = '', propLng = '') {
    if (!b || !b.serial) return '';
    let display = b.serial.toUpperCase();
    if (display.includes('__')) {
      const parts = display.split('__');
      display = `${parts[0]}<span class="serial-subline">↳ ${parts.slice(1).join('__')}</span>`;
    }
    const sizeBadge = b.size ? `<span class="size-badge">${b.size}</span>` : '';
    const makeBadge = b.make ? `<span class="make-badge">${b.make}</span>` : '';
    const editedTag = b.isEdited ? `<span class="edited-badge">EDITED</span>` : '';
    const notesTag = b.notes ? `<span class="serial-notes-tag">📝 ${b.notes}</span>` : '';
    const warnHtml = showWarning ? `<span class="warn-icon" title="Not found in Council records">⚠️</span>` : '';
    const editBtnHtml = showEdit ? `<button class="edit-btn" onclick="promptEditBin(${siteIdx}, '${streamKey}', ${binIdx})">✏️ Edit</button>` : '';

    let metaItems = [];
    if (b.lastFlipped) metaItems.push(`<span class="meta-tag">Flipped: ${b.lastFlipped}</span>`);
    if (b.lastUpdated) metaItems.push(`<span class="meta-tag">Updated: ${b.lastUpdated}</span>`);
    if (b.dist) metaItems.push(`<span class="meta-tag">Dist: ${b.dist}m</span>`);

    if (b.lat && b.lng) {
      let mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.lat + ',' + b.lng)}`;
      if (propLat && propLng) {
        mapUrl = `https://www.google.com/maps/dir/?api=1&origin=${propLat},${propLng}&destination=${b.lat},${b.lng}&travelmode=walking`;
      }
      metaItems.push(`<a href="${mapUrl}" target="_blank" class="flip-map-link">📍 Flip GPS</a>`);
    }

    const drawerId = `drawer_${siteIdx}_${streamKey}_${binIdx}`;
    let infoBtnHtml = '';
    let metaDrawerHtml = '';

    if (metaItems.length > 0) {
      infoBtnHtml = `<button type="button" class="info-btn" onclick="toggleBinMeta(this, '${drawerId}')" title="More Info">ℹ️</button>`;
      metaDrawerHtml = `<div id="${drawerId}" class="bin-meta-drawer">${metaItems.join('')}</div>`;
    }

    return `
      <div class="bin-entry">
        <div class="serial-row">
          <div class="serial-left">
            ${sizeBadge}
            ${makeBadge}
            <span class="serial-text">${display}</span>
            ${editedTag}
          </div>
          <div class="serial-right">
            ${warnHtml}
            ${infoBtnHtml}
            ${editBtnHtml}
          </div>
        </div>
        ${notesTag}
        ${metaDrawerHtml}
      </div>
    `;
  }

  function formatSizeSummary(binList) {
    const counts = {};
    binList.forEach(b => { counts[b.size] = (counts[b.size] || 0) + 1; });
    return Object.keys(counts).map(sz => `${counts[sz]} x ${sz}`).join(', ');
  }

  function renderStreamBox(st, soloBins, councilBins, sch, siteIdx, showSolo, showCouncil, hasCouncilRecord, propLat, propLng) {
    const titleText = `${st.icon} ${st.label}`;
    let runBadges = '';
    const weekSuffix = sch.weekLetter ? ` ${sch.weekLetter}` : '';

    if (showSolo) {
      if (st.key === 'Garbage' && sch.garRun) runBadges += `<span class="hdr-run-badge ${st.badgeClass}">${sch.garRun}</span>`;
      if (st.key === 'Recycling') {
        if (sch.recRun) runBadges += `<span class="hdr-run-badge ${st.badgeClass}">${sch.recRun}${weekSuffix}</span>`;
        if (sch.recSummerRun) runBadges += `<span class="hdr-run-badge hdr-run-summer">☀️ ${sch.recSummerRun}</span>`;
      }
      if (st.key === 'FOGO' && sch.fogRun) runBadges += `<span class="hdr-run-badge ${st.badgeClass}">${sch.fogRun}${weekSuffix}</span>`;
    }

    const councilSerialsSet = new Set(councilBins.map(cb => cb.serial.split('__')[0].toUpperCase()));
    const soloSerialsSet = new Set(soloBins.map(b => b.serial.split('__')[0].toUpperCase()));

    let soloBinsHtml = '';
    if (showSolo && soloBins.length > 0) {
      soloBinsHtml = soloBins.map((b, binIdx) => {
        let showWarning = false;
        if (showCouncil && hasCouncilRecord) {
          const base = b.serial.split('__')[0].toUpperCase();
          showWarning = !councilSerialsSet.has(base);
        }
        return formatSerialRow(b, siteIdx, st.key, binIdx, true, showWarning, propLat, propLng);
      }).join('');
    } else if (showSolo) {
      soloBinsHtml = `<div style="font-size:12px; color:#888; font-style:italic; padding:3px 0;">No active Solo serials recorded</div>`;
    }

    let councilSectionHtml = '';
    if (showCouncil) {
      const extraCouncilBins = councilBins.filter(cb => {
        const base = cb.serial.split('__')[0].toUpperCase();
        return !soloSerialsSet.has(base);
      });

      if (!showSolo) {
        const allCouncilHtml = councilBins.map(cb => `
          <div class="council-bin-entry">
            <div class="serial-row">
              <div class="serial-left">
                <span class="size-badge">${cb.size}</span>
                <span class="serial-text" style="color:#111111;">${cb.serial.toUpperCase()}</span>
              </div>
            </div>
          </div>
        `).join('');
        councilSectionHtml = `
          <div class="stream-council-section" style="border-top:none; margin-top:0; padding-top:0;">
            ${allCouncilHtml || '<div style="font-size:12px; color:#888; font-style:italic;">No council records</div>'}
          </div>
        `;
      } else if (extraCouncilBins.length > 0) {
        const diffBinsHtml = extraCouncilBins.map(cb => `
          <div class="council-bin-entry">
            <div class="serial-row">
              <div class="serial-left">
                <span class="size-badge">${cb.size}</span>
                <span class="serial-text" style="color:#111111;">${cb.serial.toUpperCase()}</span>
              </div>
            </div>
          </div>
        `).join('');

        councilSectionHtml = `
          <div class="stream-council-section">
            <div class="stream-council-title">🏛️ MPSC Data (${extraCouncilBins.length}):</div>
            ${diffBinsHtml}
          </div>
        `;
      }
    }

    const addBinBtnHtml = showSolo ? `<button type="button" class="add-bin-btn" onclick="promptAddBin(${siteIdx}, '${st.key}')">+ Add Bin</button>` : '';

    return `
      <div class="stream-group-card">
        <div class="stream-group-header ${st.headerClass}">
          <div class="header-left">
            <span class="stream-title">${titleText}</span>
            ${addBinBtnHtml}
          </div>
          <div class="header-right">${runBadges}</div>
        </div>
        <div class="serials-list">
          ${showSolo ? soloBinsHtml : ''}
          ${councilSectionHtml}
        </div>
      </div>
    `;
  }

  function handleSearch() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const streamFilter = document.getElementById('streamFilterSelect').value.trim();
    const resultsContainer = document.getElementById('resultsList');
    const summaryContainer = document.getElementById('resultsSummary');

    const binOnly = document.getElementById('chkBinOnly').checked;
    const addrOnly = document.getElementById('chkAddrOnly').checked;
    const showSolo = document.getElementById('chkSoloInfo').checked;
    const showCouncil = document.getElementById('chkCouncilInfo').checked;

    let matches = [];

    const matchesRun = (site) => {
      if (selectedRunsSet.size === 0) return true;
      const sch = site.soloSchedule;
      const gar = (sch.garRun || '').trim().toLowerCase();
      const rec = (sch.recRun || '').trim().toLowerCase();
      const recSum = (sch.recSummerRun || '').trim().toLowerCase();
      const fog = (sch.fogRun || '').trim().toLowerCase();

      return (gar && selectedRunsSet.has(gar)) ||
             (rec && selectedRunsSet.has(rec)) ||
             (recSum && selectedRunsSet.has(recSum)) ||
             (fog && selectedRunsSet.has(fog));
    };

    const matchesStream = (site) => {
      if (!streamFilter) return true;
      const soloCount = (site.soloStreams[streamFilter] || []).length;
      const councilCount = (site.councilStreams[streamFilter] || []).length;
      if (showSolo && showCouncil) return soloCount > 0 || councilCount > 0;
      if (showSolo) return soloCount > 0;
      if (showCouncil) return councilCount > 0;
      return soloCount > 0 || councilCount > 0;
    };

    if (!query) {
      if (userCurrentLocation && siteRecords.length > 0) {
        const nearby = [];
        siteRecords.forEach((site, idx) => {
          if (!matchesRun(site) || !matchesStream(site)) return;
          if (site.lat && site.lng && Number(site.lat) !== 0) {
            const d = getDistanceMeters(
              userCurrentLocation.lat,
              userCurrentLocation.lng,
              Number(site.lat),
              Number(site.lng)
            );
            nearby.push({ site, idx, dist: d });
          }
        });

        nearby.sort((a, b) => a.dist - b.dist);
        let closest = nearby.filter(n => n.dist <= 150);
        if (closest.length === 0) closest = nearby.slice(0, 5);

        matches = closest;
        summaryContainer.style.display = 'block';
        let filterLabel = [];
        if (streamFilter) filterLabel.push(streamFilter);
        if (selectedRunsSet.size > 0) filterLabel.push(`${selectedRunsSet.size} Runs`);
        const filterStr = filterLabel.length > 0 ? ` (${filterLabel.join(' | ')})` : '';
        summaryContainer.innerText = `📍 Closest to Live GPS${filterStr} (${closest.length} found):`;
      } else {
        if ((selectedRunsSet.size > 0 || streamFilter) && siteRecords.length > 0) {
          const filterMatches = [];
          siteRecords.forEach((site, idx) => {
            if (matchesRun(site) && matchesStream(site)) filterMatches.push({ site, idx, dist: null });
          });
          matches = filterMatches;
          summaryContainer.style.display = 'block';
          let filterLabel = [];
          if (streamFilter) filterLabel.push(streamFilter);
          if (selectedRunsSet.size > 0) filterLabel.push(`${selectedRunsSet.size} Runs`);
          summaryContainer.innerText = `Found ${matches.length} locations for ${filterLabel.join(' | ')}${matches.length > 20 ? ' (showing first 20)' : ''}:`;
        } else {
          resultsContainer.innerHTML = '';
          summaryContainer.style.display = 'none';
          return;
        }
      }
    } else {
      siteRecords.forEach((site, idx) => {
        if (!matchesRun(site) || !matchesStream(site)) return;

        const addrMatch = site.addressText.toLowerCase().includes(query) ||
                          String(site.propId).toLowerCase().includes(query) ||
                          String(site.siteId).toLowerCase().includes(query);

        const streamsToCheck = streamFilter ? [streamFilter] : ['Garbage', 'Recycling', 'FOGO'];
        let allSerials = [];
        streamsToCheck.forEach(st => {
          allSerials.push(...site.soloStreams[st].map(b => b.serial.toLowerCase()));
          allSerials.push(...site.councilStreams[st].map(b => b.serial.toLowerCase()));
        });

        const binMatch = allSerials.some(s => s.includes(query));

        let matched = false;
        if (binOnly) matched = binMatch;
        else if (addrOnly) matched = addrMatch;
        else matched = addrMatch || binMatch;

        if (matched) {
          let d = null;
          if (userCurrentLocation && site.lat && site.lng) {
            d = getDistanceMeters(userCurrentLocation.lat, userCurrentLocation.lng, Number(site.lat), Number(site.lng));
          }
          matches.push({ site, idx, dist: d });
        }
      });

      if (matches.length === 0) {
        summaryContainer.style.display = 'block';
        summaryContainer.innerText = 'Found 0 matching properties.';
        resultsContainer.innerHTML = '<div class="card empty-state">No matching assets found.</div>';
        return;
      }

      summaryContainer.style.display = 'block';
      summaryContainer.innerText = `Found ${matches.length} matching locations${matches.length > 20 ? ' (showing first 20)' : ''}:`;
    }

    const displayMatches = matches.slice(0, 20);
    resultsContainer.innerHTML = displayMatches.map(({ site, idx, dist }) => {
      const activeStreams = (!showSolo && showCouncil) ? site.councilStreams : site.soloStreams;
      const activeSchedule = (!showSolo && showCouncil) ? site.councilSchedule : site.soloSchedule;
      const count = (!showSolo && showCouncil) ? site.totalCouncilBins : site.totalSoloBins;
      const countText = count === 1 ? '1 bin at this location' : `${count} bins at this location`;

      let idLines = [];
      if (site.propId) idLines.push(`Property ID: ${site.propId}`);
      if (site.siteId && showSolo) idLines.push(`Site ID: ${site.siteId}`);
      const idsHtml = idLines.join(' | ');
      const propTypeHtml = site.councilPropType ? `<div class="rhs-type">${site.councilPropType}</div>` : '';

      let mapPinHtml = '';
      if (site.lat && site.lng) {
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(site.lat + ',' + site.lng)}`;
        mapPinHtml = `<a href="${mapUrl}" target="_blank" class="addr-map-pin" title="Open Pickup GPS">📍</a>`;
      }

      const distHtml = (dist !== null && dist !== undefined) ? `<span class="distance-pill">${Math.round(dist)}m away</span>` : '';

      // Stream count pills
      let streamCountPillsHtml = '';
      SOLO_STREAMS.forEach(st => {
        if (streamFilter && st.key !== streamFilter) return;
        const streamBins = activeStreams[st.key];
        if (streamBins.length > 0) {
          streamCountPillsHtml += `<span class="stream-count-pill ${st.pillClass}">${st.icon} ${formatSizeSummary(streamBins)}</span>`;
        }
      });
      const countsRowHtml = streamCountPillsHtml ? `<div class="stream-counts-row">${streamCountPillsHtml}</div>` : '';

      // Rating Review Banner
      let ratingBannerHtml = '';
      if (site.ratingStars) {
        const starsStr = '★'.repeat(site.ratingStars) + '☆'.repeat(5 - site.ratingStars);
        ratingBannerHtml = `
          <div class="rating-banner">
            <span class="rating-stars-val">${starsStr}</span>
            ${site.ratingComment ? `<div class="rating-comment-text">"${site.ratingComment}"</div>` : ''}
          </div>
        `;
      }

      let primaryStreamBoxesHtml = '';
      let secondaryStreamBoxesHtml = '';
      let secondaryBinCount = 0;

      const hasDirectBinMatch = query ? [
        ...site.soloStreams.Garbage, ...site.soloStreams.Recycling, ...site.soloStreams.FOGO,
        ...site.councilStreams.Garbage, ...site.councilStreams.Recycling, ...site.councilStreams.FOGO
      ].some(b => b.serial.toLowerCase().includes(query)) : false;

      SOLO_STREAMS.forEach(st => {
        if (streamFilter && st.key !== streamFilter) return;
        const soloList = site.soloStreams[st.key];
        const councilList = site.councilStreams[st.key];

        if (soloList.length > 0 || councilList.length > 0) {
          const streamHtml = renderStreamBox(st, soloList, councilList, activeSchedule, idx, showSolo, showCouncil, site.hasCouncilRecord, site.lat, site.lng);
          if (hasDirectBinMatch) {
            const hasMatch = [...soloList, ...councilList].some(b => b.serial.toLowerCase().includes(query));
            if (hasMatch) primaryStreamBoxesHtml += streamHtml;
            else { secondaryStreamBoxesHtml += streamHtml; secondaryBinCount += (soloList.length || councilList.length); }
          } else {
            primaryStreamBoxesHtml += streamHtml;
          }
        }
      });

      if (!primaryStreamBoxesHtml && !secondaryStreamBoxesHtml) {
        primaryStreamBoxesHtml = `<div style="font-size:13px; color:#888; font-style:italic; padding:6px 0;">No active bin records found</div>`;
      }

      let collapsibleHtml = '';
      if (secondaryStreamBoxesHtml) {
        const otherBinWord = secondaryBinCount === 1 ? '1 other bin' : `${secondaryBinCount} other bins`;
        collapsibleHtml = `
          <details class="other-bins-collapse">
            <summary>▶ Show ${otherBinWord} at this address</summary>
            <div class="other-bins-content">${secondaryStreamBoxesHtml}</div>
          </details>
        `;
      }

      const parentHtml = (site.parentSiteAddress && showSolo) ? `<div class="parent-info">Parent: ${site.parentSiteAddress}</div>` : '';
      const flagHtml = (site.runFlags && showSolo) ? `<div class="flag-box">Flag: ${site.runFlags}</div>` : '';

      return `
        <div class="address-card">
          <div class="address-header-row">
            <div class="address-lhs">
              <div class="address-line1">
                ${site.streetLine}
                ${mapPinHtml}
                ${distHtml}
              </div>
              <div class="address-line2">${site.suburbLine}</div>
            </div>
            <div class="property-rhs-badge">
              <div class="rhs-ids">${idsHtml}</div>
              ${propTypeHtml}
            </div>
          </div>

          <div class="prop-action-bar">
            <button type="button" class="prop-tool-btn" onclick="promptEditProperty(${idx})">⚙️ Edit Runs & Pickup GPS</button>
            <button type="button" class="prop-tool-btn" onclick="promptRateProperty(${idx})">⭐ Rate / Notes</button>
          </div>

          ${ratingBannerHtml}
          <div class="property-count-row">${countText}</div>
          ${countsRowHtml}

          <div class="schedule-bar">
            <span class="collection-day-badge">📅 ${activeSchedule.day}</span>
            ${activeSchedule.weekFormatted ? `<span class="schedule-cycle">${activeSchedule.weekFormatted}</span>` : ''}
          </div>

          ${parentHtml}
          ${flagHtml}
          ${primaryStreamBoxesHtml}
          ${collapsibleHtml}
        </div>
      `;
    }).join('');
  }
</script>

</body>
</html>
